<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yummy Restaurant 🍕</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🍽️</span>
                <span class="logo-text">Yummy Bites</span>
            </div>
            <div class="nav-links">
                <a href="#menu" class="nav-link">Menu</a>
                <a href="#" class="nav-link" id="cart-link">
                    Cart <span class="cart-badge" id="cart-count">0</span>
                </a>
                <a href="/dashboard" class="nav-link" id="dashboard-link" style="display: none;">Dashboard</a>
                <a href="/login" class="nav-link login-btn" id="login-link">Login</a>
                <button class="nav-link logout-btn" id="logout-btn" style="display: none;">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Welcome to Yummy Bites! 🎉</h1>
            <p class="hero-subtitle">Delicious food, delivered with love ❤️</p>
            <a href="#menu" class="cta-button">View Menu</a>
        </div>
    </section>

    <!-- Menu Section -->
    <section class="menu-section" id="menu">
        <h2 class="section-title">Our Menu 📖</h2>
        
        <!-- Category Filter -->
        <div class="category-filter">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="Starter">Starters</button>
            <button class="filter-btn" data-category="Main">Main Course</button>
            <button class="filter-btn" data-category="Dessert">Desserts</button>
            <button class="filter-btn" data-category="Drink">Drinks</button>
        </div>

        <!-- Menu Items Grid -->
        <div class="menu-grid" id="menu-grid">
            <!-- Menu items will be loaded here dynamically -->
        </div>
    </section>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Cart 🛒</h2>
                <button class="close-btn" id="close-cart">&times;</button>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be displayed here -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span class="total-price" id="total-price">Rs 0</span>
                </div>
                <button class="checkout-btn" id="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        
        <p>© 2024 All rights reserved</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
